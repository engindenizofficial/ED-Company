name: Sitemap'i Günlük Yenile

# ---------------------------------------------------------------------------
# BU WORKFLOW'UN SCHEDULE TETİKLEYİCİSİ DEVRE DIŞI — günlük tetikleme artık
# QStash üzerinden geliyor (bkz. scripts/setup-qstash-schedules.mjs,
# scheduleId: "revalidate-sitemap", cron "5 21 * * *" = 00:05 TR, Upstash
# Console > QStash > Schedules). Sebep: GitHub Actions'ın schedule
# tetiklemeleri garanti bir zamanlama sunmuyor; QStash dakika hassasiyetinde
# garantili teslim + otomatik retry sağlıyor.
#
# app/api/cron/revalidate-sitemap route'unu çağırır; o route da
# revalidatePath('/sitemap.xml') ile cache'i geçersiz kılar. Bu sayede gün
# değiştiğinde, kimse siteye girmese bile sitemap'teki maçlar güncel olur.
#
# Bu workflow silinmedi — workflow_dispatch ile manuel tetikleme (debug /
# acil durum) için hâlâ kullanılabilir, sadece otomatik schedule kaldırıldı.
#
# Gerekli GitHub repo secret'ları (Settings > Secrets and variables > Actions):
#   SITE_URL     -> örn. https://example.com (sondaki / olmadan)
#   CRON_SECRET  -> projedeki CRON_SECRET env var ile AYNI değer
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: {}

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: sitemap.xml cache'ini tazele
        run: |
          curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/revalidate-sitemap"
