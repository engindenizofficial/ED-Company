name: Canlı Maç Bildirimlerini Tetikle

# ---------------------------------------------------------------------------
# BU WORKFLOW'UN SCHEDULE TETİKLEYİCİSİ DEVRE DIŞI — heartbeat artık QStash
# üzerinden geliyor (bkz. scripts/setup-qstash-schedules.mjs,
# scheduleId: "live-fixture-notifications", Upstash Console > QStash >
# Schedules). Sebep: GitHub Actions'ın schedule tetiklemeleri "en az bu
# aralıkla, birebir dakikasında değil" garantisi taşıyor ve resmi
# dokümantasyona göre yoğun saatlerde 30-60 dakikaya kadar gecikebiliyor.
# QStash dakika hassasiyetinde garantili teslim + otomatik retry sağlıyor.
#
# app/api/cron/live-fixture-notifications route'u zaten "self-chaining":
# tetiklendiğinde ~260 saniye boyunca kendi içinde 30s (canlı maç varken) /
# 2dk (boştayken) aralıklarla tarama yapıp after() ile kendini yeniden
# çağırıyor — bu tetiklemenin tek görevi, zincir herhangi bir sebeple
# (platform recycle, geçici hata vb.) tamamen durursa onu yeniden ateşlemek.
# Zincir zaten çalışıyorsa route Redis kilidi sayesinde anında
# { alreadyRunning: true } döner, ekstra bir tarama başlatmaz.
#
# Bu workflow silinmedi — workflow_dispatch ile manuel tetikleme (debug /
# acil durum) için hâlâ kullanılabilir, sadece otomatik schedule kaldırıldı.
#
# Gerekli GitHub repo secret'ları (Settings > Secrets and variables > Actions):
#   SITE_URL     -> örn. https://example.com (sondaki / olmadan)
#   CRON_SECRET  -> projedeki CRON_SECRET env var ile AYNI değer
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Canlı maç tarama zincirini tetikle / heartbeat kontrolü
        run: |
          curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/live-fixture-notifications"
