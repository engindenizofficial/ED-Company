name: Oyuncu Mevki Taramasını Tetikle

# ---------------------------------------------------------------------------
# BU WORKFLOW'UN SCHEDULE TETİKLEYİCİSİ DEVRE DIŞI — tetikleme artık QStash
# üzerinden geliyor (bkz. scripts/setup-qstash-schedules.mjs,
# scheduleId: "backfill-player-positions", Upstash Console > QStash >
# Schedules). Sebep: GitHub Actions'ın schedule tetiklemeleri "en az bu
# aralıkla, birebir dakikasında değil" garantisi taşıyor ve yoğun saatlerde
# ciddi gecikebiliyor — bu route'ta (self-chaining OLMADIĞI için) her
# gecikme, taramanın toplam süresine doğrudan ekleniyordu. QStash dakika
# hassasiyetinde garantili teslim + otomatik retry sağlıyor.
#
# app/api/cron/backfill-player-positions route'u self-chaining DEĞİLDİR:
# her çağrıda tek bir batch (küçük bir oyuncu grubu) işleyip döner. Bunun
# sebebi Vercel platformunun bir fonksiyonun kendini art arda çağırmasına
# (self-fetch zinciri) sabit ~5 sıçrama sınırı koyması — daha uzun zincirler
# "508 Loop Detected" hatasıyla kesiliyordu.
#
# Her çağrı küçük bir batch işler ve hemen döner; zaten süren bir batch
# varsa (veya tarama tamamlandıysa) route no-op döner, tekrar başlatmaz.
#
# ÖNEMLİ — QStash schedule'ı, bu workflow'un gönderdiği İKİ header'ı
# (Authorization + x-vercel-protection-bypass) BİREBİR gönderir, admin
# panelindeki "Şimdi Tara" butonunun kullandığı x-player-position-manual-trigger
# header'ını GÖNDERMEZ — yani route'un "sadece admin başlatabilir, dış
# zamanlayıcı yeni koşu AÇAMAZ, sadece devam ettirebilir" davranışı
# değişmeden korunuyor.
#
# Bu workflow silinmedi — workflow_dispatch ile manuel tetikleme (debug /
# acil durum) için hâlâ kullanılabilir, sadece otomatik schedule kaldırıldı.
#
# Gerekli GitHub repo secret'ları (Settings > Secrets and variables > Actions):
#   SITE_URL       -> örn. https://example.com (sondaki / olmadan)
#   CRON_SECRET    -> projedeki CRON_SECRET env var ile AYNI değer
#   BYPASS_SECRET  -> projedeki VERCEL_AUTOMATION_BYPASS_SECRET env var ile
#                     AYNI değer. Proje Vercel Deployment Protection
#                     kullandığından, bu header olmadan platform isteği route
#                     koduna hiç ulaştırmadan 401 ile reddeder.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Oyuncu mevki taramasının bir sonraki batch'ini tetikle
        run: |
          curl -sS -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.BYPASS_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/backfill-player-positions"
