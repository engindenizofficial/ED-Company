name: Oyuncu Mevki Taramasını Tetikle

# ---------------------------------------------------------------------------
# app/api/cron/backfill-player-positions route'u KENDİ KENDİNİ tetiklemiyor
# (bkz. route.ts başındaki açıklama — Vercel'in 5-sıçrama self-fetch limiti
# yüzden çıkarıldı, "HTTP 508 Loop Detected"'ın kök nedeni buydu). Bu route
# her çağrıda SADECE tek bir batch (~250s'lik zaman bütçesi kadar oyuncu,
# tipik olarak ~150-165 oyuncu) işleyip döner.
#
# Bu workflow, taramanın gerçekten uçtan uca (7000+ oyuncu) tamamlanması
# için gereken DIŞARIDAN periyodik tetikleyicidir. Her çağrı platform için
# bağımsız/"hop 0" sayıldığı için 5-sıçrama sınırına asla dokunulmaz.
#
# "Şimdi Tara" butonu (admin panelinde) sadece ilk/bir sonraki batch'i elle
# tetikler — bu workflow kurulu olmadan tarama pratikte bitmez (7684 oyuncu
# / ~155 oyuncu-batch ≈ 50 elle tıklama gerekirdi).
#
# Gerekli GitHub repo secret'ları (Settings > Secrets and variables > Actions):
#   SITE_URL     -> örn. https://example.com (sondaki / olmadan)
#   CRON_SECRET  -> projedeki CRON_SECRET env var ile AYNI değer
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Oyuncu mevki backfill batch'ini tetikle
        run: |
          curl -sS -f --max-time 280 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/backfill-player-positions"
