name: Oyuncu Mevkilerini Güncelle

# Mevcut sitemap workflow'undan bağımsızdır. Vercel Cron kotası kullanmaz.
# GitHub Actions, site kapalı olsa bile endpoint'i çağırır.
# Gerekli repo secret'ları: SITE_URL ve CRON_SECRET

on:
  schedule:
    # Her 15 dakikada bir; 15 dakika minimum aralıkla çalışır.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  backfill-player-positions:
    runs-on: ubuntu-latest
    steps:
      - name: Mevki senkronizasyonunu başlat/devam ettir
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -f --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/backfill-player-positions"
          echo "Mevki backfill adımı tetiklendi."

      - name: Workflow özetini yaz
        run: echo "Oyuncu mevkileri workflow'u tamamlandı."

concurrency:
  group: player-position-backfill
  cancel-in-progress: false
